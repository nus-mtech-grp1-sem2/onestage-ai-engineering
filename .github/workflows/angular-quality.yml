name: Angular quality
on:
  workflow_call:
    inputs:
      node-version: {type: string, required: true}
      install-command: {type: string, required: true}
      lint-command: {type: string, required: true}
      format-command: {type: string, required: true}
      test-command: {type: string, required: true}
      build-command: {type: string, required: true}
      audit-command: {type: string, required: true}
      # Opt-in. Default false keeps fail-fast (a step runs only if all earlier ones passed).
      # When true, lint/format/test/build/audit all run once install succeeded, so one red
      # check does not hide the others. The job still fails if any step fails.
      run-all-steps: {type: boolean, required: false, default: false}
permissions: {contents: read}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '${{ inputs.node-version }}'}
      - name: Install
        id: install
        run: ${{ inputs.install-command }}
      - name: Lint
        if: ${{ (inputs.run-all-steps && !cancelled() && steps.install.outcome == 'success') || success() }}
        run: ${{ inputs.lint-command }}
      - name: Format check
        if: ${{ (inputs.run-all-steps && !cancelled() && steps.install.outcome == 'success') || success() }}
        run: ${{ inputs.format-command }}
      - name: Test
        if: ${{ (inputs.run-all-steps && !cancelled() && steps.install.outcome == 'success') || success() }}
        run: ${{ inputs.test-command }}
      - name: Build
        if: ${{ (inputs.run-all-steps && !cancelled() && steps.install.outcome == 'success') || success() }}
        run: ${{ inputs.build-command }}
      - name: Audit
        if: ${{ (inputs.run-all-steps && !cancelled() && steps.install.outcome == 'success') || success() }}
        run: ${{ inputs.audit-command }}
