name: Node TypeScript quality
on:
  workflow_call:
    inputs:
      node-version: {type: string, required: true}
      install-command: {type: string, required: true}
      lint-command: {type: string, required: true}
      format-command: {type: string, required: true}
      typecheck-command: {type: string, required: true}
      unit-command: {type: string, required: true}
      integration-command: {type: string, required: true}
      build-command: {type: string, required: true}
      audit-command: {type: string, required: true}
permissions: {contents: read}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '${{ inputs.node-version }}'}
      - run: ${{ inputs.install-command }}
      - run: ${{ inputs.lint-command }}
      - run: ${{ inputs.format-command }}
      - run: ${{ inputs.typecheck-command }}
      - run: ${{ inputs.unit-command }}
      - run: ${{ inputs.integration-command }}
      - run: ${{ inputs.build-command }}
      - run: ${{ inputs.audit-command }}
