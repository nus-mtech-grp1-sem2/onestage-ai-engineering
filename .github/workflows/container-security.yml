name: Container build and security
on:
  workflow_call:
    inputs:
      image-ref: {type: string, required: true}
      dockerfile: {type: string, required: false, default: Dockerfile}
      context: {type: string, required: false, default: .}
permissions: {contents: read}
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build --pull --file "${{ inputs.dockerfile }}" --tag "${{ inputs.image-ref }}" "${{ inputs.context }}"
      - run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "${{ inputs.image-ref }}"
