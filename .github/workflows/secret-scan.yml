name: Secret scan
on:
  workflow_call:
permissions: {contents: read}
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0}
      - name: Reject tracked environment files
        run: |
          bad="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '(^|/)\.env\.example$' || true)"
          test -z "$bad" || { echo 'Tracked .env-like files are forbidden'; exit 1; }
      - name: Scan repository
        run: gitleaks detect --source . --no-banner --redact --exit-code 1
