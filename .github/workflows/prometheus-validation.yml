name: Prometheus rule validation
on:
  workflow_call:
    inputs:
      rules-glob: {type: string, required: false, default: 'observability/*.yml'}
permissions: {contents: read}
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: promtool check rules ${{ inputs.rules-glob }}
